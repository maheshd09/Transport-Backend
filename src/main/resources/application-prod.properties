# ===================================================================
# Production Profile (Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# Database credentials injected via environment variables in Docker / Cloud (AWS, GCP, VPS)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:transportdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA in production: update schema safely, turn off console sql dumps
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# High-Performance HikariCP Connection Pool for heavy concurrent traffic
spring.datasource.hikari.pool-name=HikariCP-Prod
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Secure Production JWT (Passed via environment variable in deployment)
app.jwt.secret=${JWT_SECRET:prod-secret-must-be-configured-via-env-var-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Clean production logging (No sensitive debug info dumped to logs)
logging.level.root=INFO
logging.level.com.transport=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

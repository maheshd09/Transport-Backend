# ===================================================================
# Development Profile (Active locally by default)
# ===================================================================

# Local MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/transportdb?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=system

# Schema auto-update for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hikari Connection Pool (Dev sizing)
spring.datasource.hikari.pool-name=HikariCP-Dev
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Dev JWT Secret
app.jwt.secret=dev-secret-key-for-local-development-must-be-32-chars-long
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.transport=DEBUG
logging.level.org.springframework.web=INFO
